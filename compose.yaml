# Runs the whole system from the images published to ghcr.io.
#   docker compose up -d                          # everything except the data plane
#   docker compose --profile data-plane up -d     # also attach XDP inside the Docker VM
name: chronos

services:
  control-plane:
    image: ghcr.io/chronos-packet-scheduler/control-plane:latest
    ports:
      - "8080:8080"

  intent-engine-backend:
    image: ghcr.io/chronos-packet-scheduler/intent-engine-backend:latest
    ports:
      - "8000:8000"

  intent-engine-frontend:
    image: ghcr.io/chronos-packet-scheduler/intent-engine-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - intent-engine-backend

  data-plane:
    image: ghcr.io/chronos-packet-scheduler/data-plane:latest
    profiles: [data-plane]
    privileged: true
    network_mode: host
    environment:
      IFACE: eth0
