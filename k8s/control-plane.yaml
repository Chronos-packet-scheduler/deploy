apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: control-plane
          image: ghcr.io/chronos-packet-scheduler/control-plane:latest
          imagePullPolicy: Always
